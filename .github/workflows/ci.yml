name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: |
          forge --version
          cast --version

      - name: Configure git (required by forge install)
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"

      - name: Install Solidity dependencies
        run: |
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0
          forge install smartcontractkit/chainlink-brownie-contracts

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

      - name: Coverage (src only)
        run: forge coverage --ir-minimum --no-match-coverage "(script|test)" --report summary

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Configure git
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"

      - name: Install Solidity dependencies
        run: |
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0
          forge install smartcontractkit/chainlink-brownie-contracts

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          solc-version: 0.8.24
          fail-on: high
          slither-args: '--filter-paths "lib/|test/|script/"'
